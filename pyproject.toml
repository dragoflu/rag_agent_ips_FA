[project]
name = "rag-ips"
version = "0.1.0"
description = "Ответы на вопросы по документам: RAG и агенты"
authors = [{ name = "Андрей Флит" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic-settings>=2.4",
]

[tool.poetry]
packages = [{ include = "rag_ips", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
black = ">=24.0"
isort = ">=5.13"
flake8 = ">=7.0"
pylint = ">=3.2"
pre-commit = ">=3.7"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
